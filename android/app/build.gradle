plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}
def androidAppVersion = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json")).androidApp as String
def androidAppCode = androidAppVersion.tokenize(".").collect { it as int }.with { it[0] * 10000 + it[1] * 100 + it[2] }

android {
    namespace "app.rockfrog.chattering"
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId "app.rockfrog.chattering"
        minSdk 26
        targetSdk 35
        // One version for the app, in the repository's package.json
        // (androidApp): the computer reads it too, and offers the update to
        // an older app (app.html, androidAppUpdate). The code only grows:
        // 0.3.6 → 306, above the 10 that 0.3.5 used.
        versionCode androidAppCode
        versionName androidAppVersion
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { buildConfig true }
    // The phone's page for the encrypted link (design/85): the repository's
    // anywhere/ files, copied at build time, so the app carries the same
    // code the relay serves to browsers, signed into the APK.
    sourceSets { main { assets.srcDirs += ["$buildDir/generated/anywhere-assets"] } }
}

def anywhereDir = rootProject.file("../anywhere")
tasks.register("anywhereAssets", Sync) {
    from(new File(anywhereDir, "public")) { into "anywhere" }
    from(anywhereDir) { include "protocol.js", "client.js"; into "anywhere" }
    into "$buildDir/generated/anywhere-assets"
    doFirst {
        if (!new File(anywhereDir, "public/shell.html").exists()) throw new GradleException("anywhere/ is missing beside android/: build from a whole checkout")
    }
}
preBuild.dependsOn("anywhereAssets")
dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.squareup.okhttp3:okhttp:3.14.9"
    // Scan the pairing code from inside the app: Google's code scanner (the
    // camera UI is Google Play services', so the app asks for no camera
    // permission and sees only the scanned text).
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}
