# The whole test suite on Linux, macOS and Windows, on every push and pull
# request (design/70). Each job starts from a clean machine: the pinned
# Node (.node-version), the pinned Pi (runtime/package-lock.json), Chrome
# for the browser tests. Nothing from anyone's home.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node || 'pinned' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest Node Chattering supports (Pi's minimum; the NixOS service
        # runs 22), besides the pinned one the downloads ship.
        include:
          - os: ubuntu-latest
            node: '22.19'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          node-version-file: ${{ !matrix.node && '.node-version' || '' }}

      - name: Pinned Pi runtime
        run: npm ci --prefix runtime --no-audit --no-fund

      - name: Chrome for the browser tests
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      # rat runs notebook cells. Built from a pinned published commit, so the
      # notebook tests run here too (those needing a newer rat say so and skip).
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: rat (notebooks)
        run: go install github.com/maximerivest/rat/cmd/rat@a9a74ed1bf317cb0077c8a9ab6f3ce9648f91178 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Linux walls (bubblewrap, user namespaces)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor;
          # guest walls need them, as on the Linux desktops Chattering runs on.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Git identity for tests that commit
        run: |
          git config --global user.name "Chattering tests"
          git config --global user.email "tests@chattering.invalid"
          git config --global init.defaultBranch main

      - name: Which runtime
        run: node -e "const r=require('./runtime.js'); console.log(require('./platform.js').hostKind(), process.version, r.locatePi(), r.piVersion())"

      - name: Tests
        env:
          CHATTERING_TEST_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node --test --test-concurrency=4 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml "test/*.test.js"

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.node || 'pinned' }}
          path: test-results.xml
          if-no-files-found: ignore
