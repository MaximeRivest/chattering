# Run chosen test files on a chosen system, with each browser step logged:
# for finding where a test waits on a system nobody here sits at.
name: debug

# Push to a branch debug/<anything>; .github/debug-run says what to run:
#   first line: runner labels (JSON list), second line: test files.
on:
  push:
    branches: ['debug/**']

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.p.outputs.runners }}
      files: ${{ steps.p.outputs.files }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        run: |
          echo "runners=$(sed -n 1p .github/debug-run)" >> "$GITHUB_OUTPUT"
          echo "files=$(sed -n 2p .github/debug-run)" >> "$GITHUB_OUTPUT"
  debug:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci --prefix runtime --no-audit --no-fund
      - id: chrome
        uses: ./.github/actions/chrome
      - run: git config --global user.name "Chattering tests" && git config --global user.email "tests@chattering.invalid"
      - name: Tests, traced
        env:
          CHATTERING_TEST_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
          CHATTERING_TEST_TRACE: '1'
        run: node scripts/test-each.js ${{ needs.plan.outputs.files }}
