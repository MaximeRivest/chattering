# coturn for Chattering Anywhere (not NixOS; there, use nixos.nix).
# TURN carries the encrypted packets of phones that cannot reach their
# computer directly. It cannot read them (DTLS, end to end).
realm=anywhere.rockfrog.ai
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
# The same secret as the relay's TURN_SECRET.
static-auth-secret=REPLACE_WITH_THE_SECRET
min-port=49152
max-port=65535
# Caddy's certificate for the same name (adjust the path to your Caddy).
cert=/var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/anywhere.rockfrog.ai/anywhere.rockfrog.ai.crt
pkey=/var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/anywhere.rockfrog.ai/anywhere.rockfrog.ai.key
no-cli
# No logs: not to a file, not to the journal.
log-file=/dev/null
no-stdout-log
# Only for phones and their computers: never towards this machine or a
# private network; a ceiling per session and overall.
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
max-bps=3000000
user-quota=12
total-quota=1200
stale-nonce=600
