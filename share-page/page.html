<!doctype html>
<html lang="en" data-theme="rockfrog">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Shared document</title>
<link rel="stylesheet" href="/_c/share/tokens.css">
<link rel="stylesheet" href="/_c/share/document-editor.css">
<link rel="stylesheet" href="/_c/share/share.css">
</head>
<body>
<header class="sh-head" id="head" hidden>
  <div class="sh-title"><b id="title"></b><small id="sub"></small></div>
  <div class="sh-people" id="people" aria-live="polite"></div>
  <span class="sh-state" id="state" role="status"></span>
</header>
<main class="sh-main">
  <div class="sh-card" id="card">
    <p class="sh-wait">Opening…</p>
  </div>
  <div class="sh-doc doc-editor-host" id="doc" hidden></div>
</main>
<footer class="sh-foot">Served from the sharer's own computer by <a href="https://rockfrog.ai" rel="noopener noreferrer" target="_blank">Chattering</a>. It is online when their computer is.</footer>
<script src="/_c/share/document-look.js"></script>
<script src="/_c/share/share.js"></script>
</body>
</html>
